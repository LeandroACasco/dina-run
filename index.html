<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dina Run se mudó</title>
<link rel="canonical" href="https://kiut-studio.github.io/dina-run/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff4f7;color:#3f2433;font:500 18px/1.4 system-ui,sans-serif;text-align:center;padding:16px}a{color:#c92f4f;font-weight:700}</style>
</head>
<body>
<p>🐱 <b>Dina Run</b> se mudó a <b>Kiut Studio</b>.<br>Te llevamos con tus frutillas y tu progreso…<br><br><a id="ir" href="https://kiut-studio.github.io/dina-run/">Si no pasa nada, tocá acá</a></p>
<script>
// Junta el progreso guardado en esta dirección vieja y lo lleva a la nueva (va en la dirección, no sale a ningún servidor).
(function(){
  var DEST='https://kiut-studio.github.io/dina-run/',KEYS=['sofiRunner.v1','sofiRunner.music','sofiSilbato.v1','tortaRunnerPlus.v1'],k={},n=0;
  try{KEYS.forEach(function(x){var v=localStorage.getItem(x);if(v!=null){k[x]=v;n++}})}catch(e){}
  var url=DEST;
  if(n){try{var bytes=new TextEncoder().encode(JSON.stringify({v:1,k:k})),bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
    url=DEST+'#mudanza='+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(e){}}
  document.getElementById('ir').href=url;
  // la copia sin conexión vieja ya no sirve: se da de baja (no borra frutillas)
  try{navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(r.scope.indexOf('/dina-run/')>-1)r.unregister()})})}catch(e){}
  setTimeout(function(){location.replace(url)},900);
})();
</script>
</body>
</html>
